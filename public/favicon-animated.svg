<svg width="256" height="256" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Outer Hexagon -->
  <polygon 
    points="256,96 392,176 392,336 256,416 120,336 120,176"
    fill="#0A0A0A"
    stroke="#3CF46B"
    stroke-width="20"
  />

  <!-- Hybrid X Shape -->
  <g stroke="#3CF46B" stroke-width="32" stroke-linecap="round">
    <line x1="176" y1="176" x2="336" y2="336"/>
    <line x1="336" y1="176" x2="176" y2="336"/>
  </g>

  <!-- Pulsing Neon Core -->
  <circle cx="256" cy="256" r="70" fill="#3CF46B">
    <animate 
      attributeName="r"
      values="70;85;70"
      dur="1.8s"
      repeatCount="indefinite"
    />
    <animate 
      attributeName="opacity"
      values="0.85;1;0.85"
      dur="1.8s"
      repeatCount="indefinite"
    />
  </circle>

</svg>
